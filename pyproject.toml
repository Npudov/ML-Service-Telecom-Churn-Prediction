[project]
name = "diabetes-service"
version="0.4.5"
description = "Diabetes service prediction"
requires-python=">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pandas",
    "scikit-learn",
    "joblib",
    "psycopg[binary]",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "catboost>=1.2.10",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "locust",
    "ruff"
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "diabetes"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: нужна база данных - адрес в DATABASE_URL"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
